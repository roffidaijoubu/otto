<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor L — Talent Manager</title>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: var(--max-width);
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    /* Header */
    .header {
      height: var(--header-height);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-strong);
      background: var(--bg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-circle);
      border: 1px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      font-family: var(--font-mono);
      background: var(--surface);
      color: var(--fg);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--fg-muted);
      font-family: var(--font-mono);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--fg-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-circle);
      background: var(--warning);
    }
    .status-dot.ready { background: var(--success); }
    .status-dot.busy { background: var(--warning); }
    .status-dot.error { background: var(--error); }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) {
      background: var(--surface-alt);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.88;
      background: var(--accent);
    }
    .btn-danger {
      border-color: var(--error);
      color: var(--error);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      margin: auto;
      max-width: 440px;
      padding: 24px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
    }
    .empty-state h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .empty-state p {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: var(--fg-muted);
    }
    .starters {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .starter-btn {
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
    }
    .starter-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-alt);
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
    }
    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-meta {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .msg-body {
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      word-break: break-word;
    }
    .msg.user .msg-body {
      background: var(--user-bubble-bg);
      color: var(--user-bubble-fg);
    }
    .msg.assistant .msg-body {
      background: var(--assistant-bubble-bg);
      color: var(--assistant-bubble-fg);
    }

    .msg-body p { margin: 0 0 10px 0; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body h1, .msg-body h2, .msg-body h3 {
      margin: 12px 0 6px 0;
      font-size: 15px;
      line-height: 1.3;
    }
    .msg-body h1:first-child, .msg-body h2:first-child, .msg-body h3:first-child {
      margin-top: 0;
    }
    .msg-body ul, .msg-body ol {
      margin: 6px 0 10px 0;
      padding-left: 20px;
    }
    .msg-body li { margin: 3px 0; }
    .msg-body code {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 1px 4px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
    }
    .msg.user .msg-body code {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .msg-body pre {
      margin: 8px 0;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .msg-body pre code {
      border: none;
      padding: 0;
      background: transparent;
    }
    .msg-body blockquote {
      margin: 8px 0;
      padding: 4px 10px;
      border-left: 2px solid var(--border-strong);
      color: var(--fg-muted);
    }
    .msg-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    /* Activity Banner */
    .activity {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-muted);
    }
    .activity.visible { display: flex; }
    .activity-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--radius-circle);
      background: var(--warning);
    }

    .error-banner {
      display: none;
      padding: 8px 16px;
      border-top: 1px solid var(--error);
      background: var(--bg);
      color: var(--error);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .error-banner.visible { display: block; }

    /* Composer */
    .composer {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border-strong);
      background: var(--bg);
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 160px;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }
    .composer textarea:focus {
      background: var(--surface);
    }

    @media (max-width: 640px) {
      .app { border-left: none; border-right: none; }
      .msg { max-width: 96%; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="avatar">L</div>
        <div>
          <div class="brand-title">Professor L</div>
          <div class="brand-sub">Talent Manager</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="status" id="statusWrap">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">connecting</span>
        </span>
        <button class="btn" id="newBtn" type="button">New Chat</button>
      </div>
    </header>

    <main class="messages" id="messages"></main>

    <div class="activity" id="activity">
      <span class="activity-dot"></span>
      <span id="activityText">Thinking...</span>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <form class="composer" id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Talk to Professor L... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <button class="btn btn-danger" id="stopBtn" type="button" style="display:none">Stop</button>
      <button class="btn btn-primary" id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const composerEl = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const newBtn = document.getElementById("newBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const activityEl = document.getElementById("activity");
    const activityText = document.getElementById("activityText");
    const errorBanner = document.getElementById("errorBanner");

    let isBusy = false;
    let streamingEl = null;
    let streamingText = "";

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Minimal safe Markdown renderer (escaped first, no raw HTML injection)
    function renderMarkdown(md) {
      const codeBlocks = [];
      let text = String(md || "").replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, _lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      const lines = text.split(/\r?\n/);
      const out = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) { out.push("</ul>"); inUl = false; }
        if (inOl) { out.push("</ol>"); inOl = false; }
      };

      const inline = (s) => {
        let e = escapeHtml(s);
        e = e.replace(/`([^`]+)`/g, "<code>$1</code>");
        e = e.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        e = e.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        return e;
      };

      for (const raw of lines) {
        const line = raw.trimEnd();
        const cb = line.match(/^@@CODEBLOCK_(\d+)@@$/);
        if (cb) {
          closeLists();
          out.push(codeBlocks[Number(cb[1])]);
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          closeLists();
          out.push("<hr>");
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          closeLists();
          const lvl = h[1].length;
          out.push(`<h${lvl}>${inline(h[2])}</h${lvl}>`);
          continue;
        }
        const bq = line.match(/^>\s?(.*)$/);
        if (bq) {
          closeLists();
          out.push(`<blockquote>${inline(bq[1])}</blockquote>`);
          continue;
        }
        const ul = line.match(/^\s*[-*]\s+(.*)$/);
        if (ul) {
          if (inOl) { out.push("</ol>"); inOl = false; }
          if (!inUl) { out.push("<ul>"); inUl = true; }
          out.push(`<li>${inline(ul[1])}</li>`);
          continue;
        }
        const ol = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ol) {
          if (inUl) { out.push("</ul>"); inUl = false; }
          if (!inOl) { out.push("<ol>"); inOl = true; }
          out.push(`<li>${inline(ol[1])}</li>`);
          continue;
        }
        if (line.trim() === "") {
          closeLists();
          continue;
        }
        closeLists();
        out.push(`<p>${inline(line)}</p>`);
      }
      closeLists();
      return out.join("\n");
    }

    function setStatus(state, label) {
      statusDot.className = "status-dot " + state;
      statusText.textContent = label;
    }

    function setBusy(busy, label) {
      isBusy = busy;
      sendBtn.disabled = busy;
      newBtn.disabled = busy;
      stopBtn.style.display = busy ? "inline-block" : "none";
      if (busy) {
        setStatus("busy", "working");
        activityText.textContent = label || "Thinking...";
        activityEl.classList.add("visible");
      } else {
        setStatus("ready", "online");
        activityEl.classList.remove("visible");
      }
    }

    function showError(msg) {
      if (!msg) {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderEmptyState() {
      messagesEl.innerHTML = "";
      const box = document.createElement("div");
      box.className = "empty-state";
      box.innerHTML = `
        <h2>Professor L is in the room.</h2>
        <p>No fluff, no yes-man answers, zero AI slop. Tell me who you are or what stream/video we are working on today.</p>
        <div class="starters">
          <button class="starter-btn" type="button">Let's get started — do your homework on my channel.</button>
          <button class="starter-btn" type="button">Audit my latest YouTube uploads and roast my titles.</button>
          <button class="starter-btn" type="button">Help me plan a 4-hour segment-first stream for tonight.</button>
        </div>
      `;
      box.querySelectorAll(".starter-btn").forEach((b) => {
        b.addEventListener("click", () => {
          inputEl.value = b.textContent;
          submitMessage();
        });
      });
      messagesEl.appendChild(box);
    }

    function appendMessage(role, text) {
      const empty = messagesEl.querySelector(".empty-state");
      if (empty) empty.remove();

      const wrap = document.createElement("div");
      wrap.className = "msg " + role;

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      meta.textContent = role === "user" ? "You" : "Professor L";

      const body = document.createElement("div");
      body.className = "msg-body";
      body.innerHTML = role === "user" ? renderMarkdown(text) : renderMarkdown(text);

      wrap.appendChild(meta);
      wrap.appendChild(body);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return body;
    }

    async function loadMessages() {
      try {
        const res = await fetch("/api/messages");
        const data = await res.json();
        messagesEl.innerHTML = "";
        const list = data.messages || [];
        if (list.length === 0) {
          renderEmptyState();
        } else {
          for (const m of list) {
            appendMessage(m.role, m.text);
          }
        }
        setBusy(Boolean(data.busy), data.activity);
      } catch (err) {
        setStatus("error", "offline");
        showError("Could not load conversation history: " + err.message);
      }
    }

    function connectEvents() {
      const es = new EventSource("/api/events");
      es.onopen = () => {
        showError("");
        if (!isBusy) setStatus("ready", "online");
      };
      es.onerror = () => {
        setStatus("error", "reconnecting");
      };
      es.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.type === "status") {
          setBusy(Boolean(msg.busy), msg.activity);
        } else if (msg.type === "activity") {
          setBusy(true, msg.label);
        } else if (msg.type === "user_message") {
          appendMessage("user", msg.text);
        } else if (msg.type === "assistant_start") {
          // Create bubble lazily on first real text_delta so tool-only turns never leave an empty "..." box
          streamingText = "";
          streamingEl = null;
        } else if (msg.type === "text_delta") {
          if (!msg.delta) return;
          if (!streamingEl) {
            streamingText = "";
            streamingEl = appendMessage("assistant", "");
          }
          streamingText += msg.delta;
          streamingEl.innerHTML = renderMarkdown(streamingText);
          scrollToBottom();
        } else if (msg.type === "assistant_end") {
          if (msg.text) {
            if (!streamingEl) {
              streamingEl = appendMessage("assistant", msg.text);
            } else {
              streamingEl.innerHTML = renderMarkdown(msg.text);
            }
          }
          streamingEl = null;
          streamingText = "";
          scrollToBottom();
        } else if (msg.type === "done") {
          streamingEl = null;
          streamingText = "";
          setBusy(false);
        } else if (msg.type === "reset") {
          streamingEl = null;
          streamingText = "";
          setBusy(false);
          renderEmptyState();
        } else if (msg.type === "error") {
          showError(msg.message || "Unexpected error");
          setBusy(false);
        }
      };
    }

    async function submitMessage() {
      const text = inputEl.value.trim();
      if (!text || isBusy) return;
      showError("");
      inputEl.value = "";
      autoResize();
      setBusy(true, "Thinking...");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          showError(err.error || "Failed to send message");
          setBusy(false);
        }
      } catch (err) {
        showError("Network error: " + err.message);
        setBusy(false);
      }
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    inputEl.addEventListener("input", autoResize);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    composerEl.addEventListener("submit", (e) => {
      e.preventDefault();
      submitMessage();
    });

    stopBtn.addEventListener("click", async () => {
      await fetch("/api/abort", { method: "POST" }).catch(() => {});
    });

    newBtn.addEventListener("click", async () => {
      if (isBusy) return;
      showError("");
      await fetch("/api/new", { method: "POST" }).catch(() => {});
    });

    loadMessages().then(connectEvents);
  </script>
</body>
</html>
