name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install web dependencies (lockfile-pinned)
        working-directory: web
        run: npm ci

      - name: Run offline TypeScript unit & security test suite
        run: npm test

      - name: Run offline Python clipper unit tests & syntax check
        run: |
          python3 -m py_compile agent/skills/raw-clip-finder/scripts/*.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Typecheck frontend & Bun RPC server
        working-directory: web
        run: npm run typecheck

      - name: Build production web bundle
        working-directory: web
        run: npm run build
